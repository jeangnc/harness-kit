name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install direnv
        run: |
          sudo curl -fsSL -o /usr/local/bin/direnv https://github.com/direnv/direnv/releases/download/v2.38.2/direnv.linux-amd64
          sudo chmod +x /usr/local/bin/direnv
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
