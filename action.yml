name: harness-kit
description: >-
  Build, check, and lint a harness repo's agent plugins. In release mode, also publish each
  vendor build to a branch named after the vendor (claude, codex). Release mode requires the
  calling job to grant `permissions: contents: write` and to check out with
  `actions/checkout` using `fetch-depth: 0`.
author: Jean Gonçalves
branding:
  icon: package
  color: blue

inputs:
  mode:
    description: "`verify` runs build, check, and lint. `release` also publishes vendor branches."
    required: true
  vendors:
    description: Space-separated vendors to publish in release mode. Empty publishes every vendor in harness.yaml.
    required: false
    default: ""
  working-directory:
    description: Directory containing harness.yaml.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          verify|release) ;;
          *)
            echo "::error title=harness-kit::input 'mode' must be 'verify' or 'release', got '$MODE'"
            exit 1
            ;;
        esac

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Resolve harness-kit version
      id: version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        version=$(node -p "require(process.env.ACTION_PATH + '/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: "@jean.gnc/harness-kit@${{ steps.version.outputs.version }}"
      run: npx --yes "$HARNESS" build

    - name: Check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: "@jean.gnc/harness-kit@${{ steps.version.outputs.version }}"
      run: npx --yes "$HARNESS" check

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: "@jean.gnc/harness-kit@${{ steps.version.outputs.version }}"
      run: npx --yes "$HARNESS" lint

    - name: Configure git identity
      if: inputs.mode == 'release'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Publish
      if: inputs.mode == 'release'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: "@jean.gnc/harness-kit@${{ steps.version.outputs.version }}"
        VENDORS: ${{ inputs.vendors }}
      run: |
        args=()
        for vendor in $VENDORS; do
          args+=(--vendor "$vendor")
        done
        npx --yes "$HARNESS" publish "${args[@]}"
